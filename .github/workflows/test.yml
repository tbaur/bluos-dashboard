name: Tests

on:
  pull_request:
    branches: [ main ]
  merge_group:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # Same targets as local `make check`; the venv uses the matrix python3.
      - name: Install
        run: make backend/.venv/.installed
      - name: Lint
        run: make lint-backend
      - name: Test
        run: make test-backend
      - name: pip-audit
        run: backend/.venv/bin/pip-audit --progress-spinner off

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: make frontend/node_modules/.installed
      - name: Audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate
      # Everything but react, react-dom, react-router and zustand is a dev
      # dependency here, so the gate above covers very little. Dev-tree
      # advisories are often unfixable upstream and must not block unrelated
      # PRs, but they should not be invisible either: report and continue.
      - name: Audit dev tree (advisory only)
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=moderate
      - name: Lint
        run: make lint-frontend
      - name: Test
        run: make test-frontend
      - name: Build
        run: make build
